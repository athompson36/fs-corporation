# Local development — control API in Docker
#
#   docker compose up --build
#   curl http://localhost:8013/api/v1/health
#   docker compose exec api cat /data/owner.token
#
# Build worker image (optional):
#   docker compose --profile workers build
#
# Companion on the host (optional):
#   cd companion && VITE_API_BASE=http://localhost:8013 npm run dev
#
# HTTPS same-origin (Web Push on localhost):
#   cd companion && npm run build
#   docker compose --profile https up -d
#   open https://localhost:8443
#
# Not for production. fs-dev uses native systemd + Caddy (deploy/fs-dev/).

services:
  api:
    build:
      context: .
      dockerfile: deploy/dev/Dockerfile.api
    image: fs-corporation-api:dev
    ports:
      - "8013:8000"
# Optional: load secrets from a local file (gitignored). Example:
#   cp deploy/fs-dev/secrets.example.env .env
#   # edit .env with GITHUB_APP_ID, GITHUB_INSTALLATION_ID, GITHUB_PRIVATE_KEY_FILE
    env_file:
      - path: .env
        required: false
    volumes:
      - fs-corp-data:/data
      - ./secrets/github-app.pem:/run/secrets/github-app.pem:ro
      - ./secrets/vapid-public.pem:/run/secrets/vapid-public.pem:ro
      - ./secrets/vapid-private.pem:/run/secrets/vapid-private.pem:ro
      - ./scripts:/src/scripts:ro
      - ./company:/src/company:ro
      - ./.local/worker-scratch:/worker-scratch
      # Host Docker socket — required for runtime=container dispatch from the API container
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PYTHONPATH: /src
      FS_CORP_WORKER_IMAGE: fs-corporation-worker:local
      FS_CORP_WORKER_SCRATCH: /worker-scratch
      FS_CORP_DATA_DIR: /data
      FS_CORP_DB: /data/company.db
      FS_CORP_ALLOW_CORS: "1"
      FS_CORP_PUBLIC_URL: http://localhost:8013
    restart: unless-stopped

  worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: deploy/fs-dev/Dockerfile.worker
    image: fs-corporation-worker:local
    network_mode: none

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/dev/Caddyfile.https:/etc/caddy/Caddyfile:ro
      - ./companion/dist:/srv/companion:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  fs-corp-data:
