[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "fs-tech-ai-company"
version = "0.3.4"
description = "Local governance reference core and Cursor starter for a persistent AI company"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "alembic>=1.14.0",
  "httpx>=0.27.0",
]
[tool.setuptools.packages.find]
include = ["company*"]
