[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "fs-corporation"
version = "0.3.20"
description = "Local governance reference core and Cursor starter for FS-Corporation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "alembic>=1.14.0",
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.8.0",
  "pywebpush>=2.0.0",
  "segno>=1.6.0",
]
[tool.setuptools.packages.find]
include = ["company*"]
